name: Release screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Capture actual app Settings
        timeout-minutes: 5
        run: |
          export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          export BITCHORD_SCREENSHOT_HOME="$(mktemp -d)"
          export HOME="$BITCHORD_SCREENSHOT_HOME"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache" XDG_DATA_HOME="$HOME/data"
          export JAVA_TOOL_OPTIONS="-Duser.home=$HOME -Djava.util.prefs.userRoot=$HOME/prefs"
          export BITCHORD_RELEASE_SCREENSHOT=1
          chmod +x gradlew
          timeout --kill-after=15s 270s xvfb-run -a -s '-screen 0 1600x1000x24' ./gradlew --no-daemon :desktopApp:test --tests '*DesktopReleaseScreenshotTest' -Pbitchord.version=1.12.0
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-v1.12-desktop-screenshot
          path: desktopApp/build/reports/release-screenshot/v1.12.0-desktop.png
          if-no-files-found: warn
