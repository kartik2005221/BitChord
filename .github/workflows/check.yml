name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Desktop · Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      # A single-component label used by Build tes Appimage must not become
      # the invalid Windows installer version "1.29" during Gradle configuration.
      - name: Validate short numeric test label
        run: ./gradlew :desktopApp:help "-Pbitchord.version=1"

      - name: Set up X11 for native window tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-pil

      # Regression coverage for the packaging failure: the app may use a descriptive
      # test label, but native installer metadata must remain a valid numeric version.
      - name: Tests
        env:
          BITCHORD_PIP_NATIVE_TEST: '1'
        run: xvfb-run -a ./gradlew :shared:jvmTest :sharedUi:jvmTest :desktopApp:test "-Pbitchord.version=test-visua"

      - name: Build the distributable
        run: ./gradlew :desktopApp:createDistributable "-Pbitchord.version=test-visua"

      - name: Linux packaged collection menus
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' /usr/bin/python3 desktopApp/packaging/tests/linux-menu-smoke.py \
            desktopApp/build/compose/binaries/main/app/BitChord/bin/BitChord --output "$RUNNER_TEMP/bit-chord-menu-smoke"

      - name: Upload collection menu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-menu-linux-evidence
          path: |
            ${{ runner.temp }}/bit-chord-menu-smoke/*.png
            ${{ runner.temp }}/bit-chord-menu-smoke/results.json
            ${{ runner.temp }}/bit-chord-menu-smoke/app.log
          if-no-files-found: ignore

      - name: Linux packaged AutoMix JNI and model regression
        run: bash desktopApp/packaging/tests/linux-automix-check.sh

      - name: The analyser is in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libbitchord_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Upload PiP render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-linux-render-evidence
          path: desktopApp/build/reports/pip-rebuild/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  desktop-windows:
    name: Desktop · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Install Windows native build tools
        id: msys2
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja

      - name: Add MinGW tools to the Windows PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Join-Path $env:MSYS2_LOCATION 'mingw64\bin' >> $env:GITHUB_PATH

      - name: Verify Windows native build tools
        shell: pwsh
        run: |
          foreach ($tool in 'cmake', 'g++', 'ninja') {
            $exe = Get-Command -Name $tool -CommandType Application -ErrorAction Stop |
              Select-Object -First 1 -ExpandProperty Source
            Write-Host "$tool found at $exe"
            & $exe --version
            if ($LASTEXITCODE -ne 0) { throw "$tool could not run" }
          }

      # Keep Windows' EXE/MSI metadata valid for the same descriptive build labels.
      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :sharedUi:jvmTest :desktopApp:test "-Pbitchord.version=test-visua"

      - name: Build the distributable
        run: .\gradlew.bat :desktopApp:createDistributable "-Pbitchord.version=test-visua"

      - name: Windows packaged AutoMix JNI and dependency regression
        shell: pwsh
        run: ./desktopApp/packaging/tests/windows-automix-check.ps1

      - name: The analyser is in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/bitchord_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/bitchord_smtc.dll'

      - name: Upload PiP render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-windows-render-evidence
          path: desktopApp/build/reports/pip-rebuild/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  android:
    name: Android
    # Gate A1 uses desktop checks to decide whether pull requests can land.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: |
          set +e
          ./gradlew testDevDebugUnitTest --console=plain 2>&1 | tee /tmp/bitchord-android-tests.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            python3 - <<'PYERRORS'
          import re
          from pathlib import Path
          lines = Path('/tmp/bitchord-android-tests.log').read_text(errors='replace').splitlines()
          errors = [line for line in lines if re.search(r'(^e: |error:|Execution failed for task|^> .*[Ff]ail)', line)]
          for line in errors[:80]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYERRORS
          fi
          exit "$test_status"

      - name: Build the dev APK
        run: ./gradlew assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
